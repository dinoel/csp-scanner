<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Short Put Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./scanner.css" />
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var scan = p.get('scan');
    var profile = p.get('profile') || 'medium';
    if (!scan) {
      document.write('<p style="color:#e6ecf3;font-family:sans-serif;padding:40px;background:#0b0e13;margin:0">Missing <code>?scan=&lt;timestamp&gt;</code> in URL.</p>');
      return;
    }
    window.__SCAN_ID = scan;
    window.__INITIAL_PROFILE = profile;
    document.write('<script src="../' + encodeURIComponent(scan) + '/data.js"><\/script>');
  })();
</script>
</head>
<body data-theme="dark">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="./scanner.jsx"></script>
<script type="text/babel">
  if (window.SCAN_DATA) {
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ScannerApp />);
  }
</script>
</body>
</html>
